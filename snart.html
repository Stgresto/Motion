<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11110F">
<meta name="robots" content="noindex">
<title>Kommer snart · MOTION UF</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#11110F;--cream:#F3EFE7;--gold:#B8925A;--gold-l:#E6D5AE;--mut:#A9A397}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(900px 500px at 50% 0,rgba(184,146,90,.22),transparent 70%),var(--ink);color:var(--cream);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:40px 22px;text-align:center;-webkit-font-smoothing:antialiased}
img.sym{width:64px;height:64px;margin-bottom:28px;animation:rot 40s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.eyebrow{letter-spacing:.3em;font-size:.74rem;font-weight:700;color:var(--gold-l);text-transform:uppercase}
h1{font-weight:300;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:-.03em;line-height:1.02;margin:16px 0}
p.lead{color:var(--mut);max-width:30em;line-height:1.6}
form{margin-top:34px;width:100%;max-width:440px;text-align:left}
label.l{display:block;font-size:.8rem;letter-spacing:.1em;color:var(--mut);margin-bottom:6px;text-transform:uppercase}
input[type=email]{width:100%;min-height:54px;padding:0 18px;background:rgba(255,255,255,.06);border:1px solid #4a4741;color:var(--cream);font:inherit;font-size:1rem}
input[type=email]:focus{outline:2px solid var(--gold);outline-offset:2px}
.c{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.8rem;line-height:1.5;color:var(--mut);cursor:pointer}
.c input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#B8925A}
.c a{color:var(--gold-l)}
button{width:100%;min-height:56px;background:var(--gold);color:var(--ink);border:0;font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:12px;font-size:.85rem;color:var(--mut);min-height:1.4em;text-align:center}
.ok{display:none;margin-top:34px}
.ok h2{font-weight:300;font-size:2rem;margin-bottom:8px}
.done form{display:none}.done .ok{display:block}
.back{margin-top:34px;color:var(--mut);font-size:.9rem}.back a{color:var(--gold-l)}
</style>
</head>
<body>
<img class="sym" src="/images/motion-symbol-gold.svg" alt="">
<span class="eyebrow">MOTION UF · Coming soon</span>
<h1>Kommer snart.</h1>
<p class="lead">Appen och AI-coachen är på väg. Lämna din mejladress så hör vi av oss först av alla när det är dags.</p>
<form id="f" novalidate>
  <label class="l" for="e">Mejladress</label>
  <input type="email" id="e" placeholder="namn@mejl.se" required autocomplete="email">
  <label class="c"><input type="checkbox" id="k" required><span>Jag samtycker till att MOTION UF sparar min mejladress för att meddela mig när appen släpps. Jag är minst 13 år (eller har en vårdnadshavares OK). Du kan återkalla samtycket när som helst. Läs <a href="/integritet.html" target="_blank" rel="noopener">integritetspolicyn</a>.</span></label>
  <button type="submit">Meddela mig</button>
  <p id="msg" role="alert">Ett mejl när det är dags. Inget annat.</p>
</form>
<div class="ok" role="status"><h2>Du är med.</h2><p class="lead">Vi mejlar dig så fort appen öppnar.</p></div>
<p class="back"><a href="/">← Till startsidan</a></p>
<script>
(function(){
  var f=document.getElementById('f'),e=document.getElementById('e'),m=document.getElementById('msg');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!e.value||!e.checkValidity()){m.textContent='Skriv en giltig mejladress.';e.focus();return}
    if(!document.getElementById('k').checked){m.textContent='Kryssa i samtycket för att gå med.';return}
    var b=f.querySelector('button');b.disabled=true;b.textContent='Skickar…';
    fetch('https://formspree.io/f/mjykbdey',{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({email:e.value,samtycke:'Ja, '+new Date().toISOString(),källa:'Motion UF väntelista (appen)'})})
      .then(function(r){if(!r.ok)throw 0;document.body.classList.add('done')})
      .catch(function(){b.disabled=false;b.textContent='Meddela mig';m.textContent='Det gick inte att skicka. Försök igen.'});
  });
})();
</script>
</body>
</html>
