<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Motion UF</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/images/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--white:#FFFFFF;--warm:#EFEAE2;--green:#123C32;--green-2:#1B4A3E;
  --text:#171A18;--muted:#72746F;--gold:#C6A15B;--gold-l:#E6D5AE;--border:#D6CFC1;--border-soft:#E3DDD1;
  --gold-ink:#94733A; /* gold dark enough for text on light bg */
  --r-lg:0;--r-md:0;--r-sm:0;
  --shadow:0 1px 2px rgba(23,26,24,.06),0 6px 16px -10px rgba(23,26,24,.14);
  --ease:cubic-bezier(.2,.7,.1,1);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
img{display:block}

:root{--nav-w:248px}
html.nav-min{--nav-w:76px}
body{padding-left:var(--nav-w);transition:padding-left .3s var(--ease)}
.sidenav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);z-index:50;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:calc(18px + var(--sat)) 12px 18px;transition:width .3s var(--ease);overflow:hidden}
.sn-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 4px 18px 8px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.08em;font-size:.92rem;text-decoration:none;color:var(--text);white-space:nowrap}
.brand img{width:28px;height:28px;flex-shrink:0}
.sn-toggle{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border);flex-shrink:0;transition:transform .3s var(--ease),color .2s}
.sn-toggle:hover{color:var(--text);border-color:var(--text)}
.sn-nav{display:flex;flex-direction:column;gap:2px}
.sn-link{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.98rem;border-left:2px solid transparent;white-space:nowrap;transition:background .2s,color .2s}
.sn-link svg,.sn-link img{width:22px;height:22px;flex-shrink:0}
.sn-link:hover{color:var(--text);background:var(--bg)}
.sn-link.on{color:var(--text);background:var(--bg);border-left-color:var(--gold);font-weight:600}
.sn-home{margin-top:auto;margin-bottom:10px;font-size:.92rem}
.sn-profile{display:flex;align-items:center;gap:12px;padding:14px 8px 0;border-top:1px solid var(--border);text-decoration:none;color:var(--text);white-space:nowrap}
.sn-profile .avatar{flex-shrink:0}
.sn-profile b{display:block;font-size:.95rem;font-weight:600}
.sn-profile small{display:block;color:var(--muted);font-size:.8rem}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.95rem;text-decoration:none}
html.nav-min .lbl{display:none}
html.nav-min .sn-top{flex-direction:column;padding:0 0 14px;gap:14px}
html.nav-min .sn-toggle{transform:rotate(180deg)}
html.nav-min .sn-link{justify-content:center;padding:0}
html.nav-min .sn-profile{justify-content:center;padding:14px 0 0}
.mtop{display:none}
.mback{gap:8px}
.mback svg{color:var(--muted)}
@media(max-width:760px){
  body{padding-left:0}
  .sidenav{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;height:calc(58px + var(--sat));padding:var(--sat) 20px 0;background:rgba(247,245,240,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
}
/* ---------- bottom nav (mobile) ---------- */
.botnav{display:none}
@media(max-width:760px){
  .botnav{display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:8px 8px calc(8px + var(--sab))}
  .botnav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600;min-height:52px;justify-content:center}
  .botnav a svg{width:24px;height:24px}
  .botnav a.on{color:var(--green)}
  .botnav .scanbtn{position:relative;top:-14px}
  .botnav .scanbtn .disc{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(18,60,50,.55);border:4px solid var(--bg)}
  .botnav .scanbtn .disc svg{width:28px;height:28px}
  .botnav .scanbtn span{margin-top:2px}
}

/* ---------- layout ---------- */
main{max-width:1280px;margin:0 auto;padding:40px 32px 120px}
@media(max-width:760px){main{padding:24px 20px calc(130px + var(--sab))}}
.view{animation:fadein .45s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow.gold{color:var(--gold-ink)}
h1.big{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:600;letter-spacing:-.025em;line-height:1.08}
h2.h{font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.card{background:var(--white);border:1px solid var(--border);border-radius:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:0;font-weight:600;font-size:.98rem;letter-spacing:.01em;transition:transform .15s var(--ease),background .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-2)}
.btn-gold{background:var(--gold);color:#171A18}
.btn-gold:hover{background:#cfac69}
.btn-line{border:1px solid var(--border);background:var(--white)}
.btn-line:hover{border-color:#d5cfc3}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{color:var(--text)}
.btn-sm{min-height:40px;padding:0 16px;font-size:.9rem}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:0;border:1px solid var(--border);background:var(--white);font-weight:600;font-size:.88rem;letter-spacing:.02em;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--gold-l)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- TODAY ---------- */
.today{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:36px}
@media(max-width:960px){.today{grid-template-columns:1fr}}
.next{position:relative;overflow:hidden;color:#fff;border-radius:0;padding:36px;min-height:340px;display:flex;flex-direction:column;isolation:isolate;
  background:linear-gradient(100deg,rgba(14,30,24,.74) 0%,rgba(14,30,24,.48) 50%,rgba(14,30,24,.12) 100%),url('/images/next-bg.jpg') center 62%/cover no-repeat,var(--green)}
.next:not(.empty)::before{content:"";position:absolute;inset:-20px;z-index:-1;background:inherit;filter:blur(6px);transform:scale(1.04)}
.next:not(.empty) .swirl{display:none}
.next .swirl{position:absolute;right:-60px;top:-60px;width:280px;opacity:.12;filter:grayscale(.2) brightness(1.4)}
.next .eyebrow{color:var(--gold-l)}
.next .time{font-size:clamp(3.4rem,8vw,5.4rem);font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:22px}
.next .what{font-size:1.25rem;font-weight:600;margin-top:12px;letter-spacing:.01em}
.next .meta{display:flex;gap:18px;margin-top:10px;color:rgba(255,255,255,.72);font-size:.95rem}
.next .why{color:rgba(255,255,255,.82);margin-top:18px;max-width:28em}
.next .actions{margin-top:auto;padding-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.next .btn-line{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.next.empty{background:var(--white);color:var(--text);border:1px solid var(--border)}
.next.empty .eyebrow{color:var(--gold-ink)}
.next.empty .why{color:var(--muted)}
.next.empty .swirl{opacity:.08;filter:none}
.timeline{padding:28px}
.tl{list-style:none;margin-top:18px}
.tl li{display:grid;grid-template-columns:62px 14px 1fr;gap:14px;align-items:start;padding:10px 0;position:relative}
.tl li::after{content:"";position:absolute;left:82px;top:30px;bottom:-12px;width:1px;background:var(--border)}
.tl li:last-child::after{display:none}
.tl .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:#c9c1b2;margin-top:7px;position:relative;z-index:1}
.tl .lbl{font-weight:600;font-size:.92rem;letter-spacing:.06em;text-transform:uppercase}
.tl .sub{color:var(--muted);font-size:.9rem}
.tl li.motion .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(198,161,91,.18)}
.tl li.motion .lbl{color:var(--green)}
.tl li.past{opacity:.45}
.tl li.done .dot{background:var(--green)}
.weeksum{margin-top:28px;padding:28px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:28px;align-items:center}
.weeksum .n{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.weeksum .l{color:var(--muted);font-size:.92rem}
@media(max-width:620px){.weeksum{grid-template-columns:1fr 1fr 1fr}.weeksum .eyebrow{grid-column:1/-1}}

/* ---------- PLANNER ---------- */
.planner{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;margin-top:28px}
.p-side{display:flex;flex-direction:column;gap:20px}
.mini{padding:20px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}
.mini-h button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.mini-h button:hover{background:var(--warm);color:var(--text)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.85rem}
.mini-g .wd{color:var(--muted);font-size:.72rem;font-weight:600;padding:4px 0}
.mini-g button{height:32px;border-radius:0;font-variant-numeric:tabular-nums;display:grid;place-items:center;line-height:1;padding:0}
.mini-g button:hover{background:var(--warm)}
.mini-g button.out{color:#bdb8ad}
.mini-g button.inweek{background:var(--warm)}
.mini-g button.is-today{color:var(--green);font-weight:700;box-shadow:inset 0 0 0 1px var(--gold)}
.filters{padding:20px}
.filters label{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;font-size:.95rem}
.filters input{appearance:none;width:20px;height:20px;border-radius:0;border:1.5px solid #cfc9bd;display:grid;place-items:center}
.filters input:checked{background:var(--green);border-color:var(--green)}
.filters input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.filters .sw{width:10px;height:10px;border-radius:3px;margin-left:auto}
.windows{padding:20px}
.win{padding:14px 0;border-top:1px solid var(--border)}
.win:first-of-type{border-top:0}
.win .d{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.win .r{font-weight:600;margin:2px 0 8px}
.p-main{min-width:0}
.p-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.p-bar h2{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);background:var(--white)}
.iconbtn:hover{border-color:#d5cfc3}
.week{overflow:hidden}
.wk-head{display:grid;grid-template-columns:60px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border)}
.wk-head div{padding:14px 8px;text-align:center}
.wk-head .dn{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:600}
.wk-head .dd{font-size:1.25rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.wk-head .is-today .dd{color:var(--green)}
.wk-head .is-today .dd::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin:4px auto 0}
.wk-body{display:grid;grid-template-columns:60px repeat(7,minmax(0,1fr));position:relative;max-height:calc(100vh - 290px);min-height:480px;overflow-y:auto}
.hours div{height:var(--hh);font-size:.75rem;color:var(--muted);text-align:right;padding-right:10px;transform:translateY(-.6em);font-variant-numeric:tabular-nums}
.daycol{position:relative;border-left:1px solid var(--border);background-image:linear-gradient(var(--border-soft) 1px,transparent 1px);background-size:100% var(--hh)}
.daycol.is-today{background-color:rgba(239,234,226,.45)}
.ev{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;border-radius:0;padding:6px 9px;overflow:hidden;font-size:.8rem;line-height:1.3;text-align:left;border:1px solid transparent;transition:transform .2s var(--ease),box-shadow .2s}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow);z-index:3}
.ev .et{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem}
.ev .eh{font-variant-numeric:tabular-nums;opacity:.75}
.ev.cat-school{background:#EAE6DE;color:#3d3f3b}
.ev.cat-work{background:#E4E7E3;color:#33403a}
.ev.cat-training{background:#E8E1D2;color:#4a3d22}
.ev.cat-meal{background:#F1ECE3;color:#5a5a55;border-color:#E5E1D9}
.ev.cat-personal{background:#ECE7EE;color:#43384a}
.ev.cat-motion{background:var(--green);color:#fff;border-left:3px solid var(--gold)}
.ev.cat-motion .et{color:var(--gold-l)}
.ev.cat-motion.done{opacity:.6}
.ev .go{display:inline-block;margin-top:4px;font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--gold-l)}
.ghost{position:absolute;left:4px;right:4px;border-radius:0;border:1.5px dashed var(--gold);background:rgba(198,161,91,.07);padding:6px 9px;font-size:.74rem;color:var(--gold-ink);text-align:left}
.ghost b{display:block;font-size:.7rem;letter-spacing:.08em}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--gold);z-index:4}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.daystrip{display:none}
@media(max-width:1060px){.planner{grid-template-columns:1fr}.p-side{display:none}.p-side.mobile-show{display:flex}}
@media(max-width:760px){
  .wk-head{display:none}
  .p-bar h2{width:100%;font-size:1.2rem}
  .p-bar #impBtn,.p-bar #addBtn{flex:1 1 40%;margin-left:0}
  .daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
  .daystrip button{display:flex;flex-direction:column;align-items:center;padding:10px 0;border-radius:0;min-height:62px}
  .daystrip .dn{font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:600}
  .daystrip .dd{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
  .daystrip button.on{background:var(--green);color:#fff}
  .daystrip button.on .dn{color:var(--gold-l)}
  .daystrip .has{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:3px}
  .wk-body{grid-template-columns:52px 1fr;max-height:none}
  .ev{font-size:.88rem;padding:8px 12px}
  .ev .et{font-size:.78rem}
}

/* ---------- SHEETS / MODALS ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(23,26,24,.32);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.sheet{background:var(--white);border-radius:0;width:100%;max-width:520px;max-height:calc(100svh - 40px);overflow:auto;padding:30px;transform:translateY(12px) scale(.98);transition:transform .35s var(--ease);position:relative}
.scrim.in .sheet{transform:none}
.sheet h3{font-size:1.45rem;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.sheet .x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sheet .x:hover{background:var(--warm);color:var(--text)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 18px;border:1px solid var(--border);border-radius:0;font-weight:600;text-align:left;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--gold-l);background:#fdfcf9}
.opt.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt .sw{width:12px;height:12px;border-radius:0;flex-shrink:0}
.opt.motion{grid-column:1/-1;background:var(--green);color:#fff;border-color:var(--green)}
.opt.motion img{width:22px;height:22px}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opts.four .opt{justify-content:center;min-height:64px;font-size:1.05rem}
.opts.five{grid-template-columns:repeat(2,1fr)}
.opts.five .opt:last-child{grid-column:1/-1;justify-content:center}
@media(max-width:480px){.opts.four{grid-template-columns:repeat(2,1fr)}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{min-height:50px;border:1px solid var(--border);border-radius:0;padding:0 14px;background:var(--bg);font-size:1rem}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);background:#fff}
.sheet-actions{display:flex;gap:10px;margin-top:24px}
.sheet-actions .btn{flex:1}
.gen{margin-top:20px;border-radius:0;background:var(--green);color:#fff;padding:26px;position:relative;overflow:hidden}
.gen .eyebrow{color:var(--gold-l)}
.gen .big{font-size:2.6rem;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.gen .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.gen .tag{border:1px solid rgba(255,255,255,.25);border-radius:0;padding:6px 12px;font-size:.8rem;font-weight:600;letter-spacing:.08em}
.gen img{position:absolute;right:-30px;bottom:-30px;width:150px;opacity:.12}
.steps-dots{display:flex;gap:6px;margin-bottom:16px}
.steps-dots i{width:22px;height:3px;border-radius:2px;background:var(--border)}
.steps-dots i.on{background:var(--gold)}

/* ---------- AI ---------- */
.ai{max-width:780px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100svh - 200px)}
.ai-head{text-align:center;padding:12px 0 8px}
.ai-head img{width:40px;height:40px;margin:0 auto 14px;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:rotate(25deg) scale(1.04)}}
.ai-head h1{font-size:.85rem;letter-spacing:.24em;font-weight:700}
.ai-head p{color:var(--muted);margin-top:4px}
.thread{flex:1;padding:28px 0 20px;display:flex;flex-direction:column;gap:22px}
.msg{max-width:100%;animation:fadein .35s var(--ease)}
.msg.me{align-self:flex-end;background:var(--warm);padding:12px 18px;border-radius:0;max-width:80%}
.msg.bot{display:grid;grid-template-columns:28px 1fr;gap:14px}
.msg.bot>img{width:24px;height:24px;margin-top:3px}
.msg.bot .body p+p{margin-top:8px}
.msg.bot .body{font-size:1.05rem;line-height:1.6}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:4px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hello{text-align:center;padding:40px 0 10px}
.hello h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:600;letter-spacing:-.02em}
.hello p{color:var(--muted);margin-top:6px;font-size:1.1rem}
.sugg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.composer{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--bg) 30%)}
@media(max-width:760px){.composer{bottom:calc(76px + var(--sab))}}
.composer form{display:flex;gap:8px;align-items:center;background:var(--white);border:1px solid var(--border);border-radius:0;padding:6px 6px 6px 22px;box-shadow:var(--shadow)}
.composer input{flex:1;border:0;outline:0;background:transparent;font-size:1rem;min-height:44px}
.composer button{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex-shrink:0}
.composer button:disabled{opacity:.4}
.composer .clip{background:transparent;color:var(--muted);width:42px;height:42px}
.composer .clip:hover{background:var(--warm);color:var(--text)}
.drop{margin-top:20px;border:1.5px dashed #d8d1c3;border-radius:0;padding:34px 20px;text-align:center;background:var(--bg);transition:border-color .2s,background .2s;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--gold);background:#fbf8f2}
.drop svg{color:var(--gold);margin:0 auto 10px}
.drop b{display:block;font-size:1.05rem}
.drop span{color:var(--muted);font-size:.9rem}
.imp-load{text-align:center;padding:40px 0 20px}
.imp-load img{width:46px;margin:0 auto 14px;animation:spin 1.6s linear infinite}
.imp-list{list-style:none;margin-top:14px;max-height:46svh;overflow:auto;border-top:1px solid var(--border)}
.imp-list li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.imp-list li.off{opacity:.4}
.imp-list input[type=checkbox]{appearance:none;width:20px;height:20px;border-radius:0;border:1.5px solid #cfc9bd;display:grid;place-items:center;cursor:pointer}
.imp-list input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
.imp-list input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.imp-list .t{font-weight:600}
.imp-list .m{color:var(--muted);font-size:.88rem}
.imp-list .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--green)}
.hint{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:0;background:var(--warm);font-size:.9rem}
.hint img{width:18px}
.hint a{color:var(--green);font-weight:600}
.act .scope{display:flex;gap:8px;flex-wrap:wrap}
.act .mv{font-size:1.35rem;flex-wrap:wrap;white-space:nowrap}
.act{margin-top:14px;border:1px solid var(--border);background:var(--white);border-radius:0;padding:20px;max-width:420px}
.act .eyebrow{margin-bottom:8px}
.act .main{font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.act .sub{color:var(--muted);font-size:.95rem}
.act .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.act.done{opacity:.7}
.act.done .btns{display:none}
.act .ok{display:none;color:var(--green);font-weight:600;margin-top:12px;font-size:.95rem}
.act.done .ok{display:block}
.wk-prop{list-style:none;margin-top:6px}
.wk-prop li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.wk-prop li:first-child{border-top:0}
.wk-prop .d{font-size:.75rem;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.wk-prop .s{font-weight:600}
.wk-prop input[type=time]{border:1px solid var(--border);border-radius:0;padding:6px 8px;background:var(--bg);font-variant-numeric:tabular-nums}
.wk-prop .rm{width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.wk-prop .rm:hover{background:var(--warm)}
.wk-prop li.off{opacity:.35}
.mv{display:flex;align-items:center;gap:14px;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.mv span{color:var(--gold)}

/* ---------- SCAN ---------- */
.scan{max-width:520px;margin:0 auto;text-align:center}
.scan h1{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.scan .lead{color:var(--muted);margin-top:4px}
.sess-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--white);border:1px solid var(--border);border-radius:0;padding:14px 18px;margin-bottom:22px;text-align:left}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--green)}
.dots i.on{background:var(--green)}
.cam{position:relative;margin-top:24px;aspect-ratio:1/1.08;border-radius:0;overflow:hidden;background:#EFE8DB}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border-radius:0}
.cam .frame i{position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid;border-width:0}
.cam .frame i:nth-child(1){top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:18px}
.cam .frame i:nth-child(2){top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:18px}
.cam .frame i:nth-child(3){bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:18px}
.cam .frame i:nth-child(4){bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:18px}
.cam .line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanline 2.6s ease-in-out infinite}
@keyframes scanline{0%,100%{top:10%}50%{top:88%}}
.cam .hint{position:absolute;left:0;right:0;bottom:22px;color:rgba(255,255,255,.85);font-size:.92rem}
.cam .off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--text);padding:30px;text-align:center;background:radial-gradient(75% 65% at 50% 42%,#FBF8F2 0%,#EFE8DB 100%);border:1px solid var(--border);border-radius:0}
.cam .off img{width:96px;height:96px;display:block;margin:0 auto 4px;animation:breathe 7s ease-in-out infinite}
.cam .off div{max-width:22em;color:var(--muted)}
.scan-alt{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.manual{display:flex;gap:8px;margin-top:4px}
.manual input{flex:1;min-width:0;min-height:52px;border:1px solid var(--border);border-radius:0;padding:0 20px;background:var(--white);letter-spacing:.04em;font-weight:600}
.manual input::placeholder{font-weight:500;letter-spacing:0;color:#9a9b96}
.manual input:focus{outline:none;border-color:var(--gold)}
.found{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.found img{width:72px;animation:spin 1.4s var(--ease) infinite}
.found.ok img{animation:settle .8s var(--ease) forwards}
.found .lbl{font-weight:700;letter-spacing:.22em;font-size:.85rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes settle{from{transform:rotate(0) scale(1)}to{transform:rotate(200deg) scale(1.12)}}

/* ---------- EXERCISE ---------- */
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;max-width:1080px;margin:0 auto}
@media(max-width:860px){.ex{grid-template-columns:1fr;gap:28px}}
.ex-visual{position:relative;aspect-ratio:1;border-radius:0;background:radial-gradient(70% 70% at 50% 45%,#fbf8f2,#efe8db);display:grid;place-items:center;overflow:hidden;border:1px solid var(--border)}
.ex-visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc{width:min(56%,280px);aspect-ratio:5/7;border-radius:0;background:linear-gradient(165deg,#FBF8F1,#F1EBDF);box-shadow:0 30px 50px -22px rgba(70,52,30,.45);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12% 9%;animation:floaty 6s ease-in-out infinite;container-type:inline-size}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-1deg)}}
.pc::after{content:"";position:absolute;inset:5%;border:1px solid var(--gold);border-radius:0;pointer-events:none}
.pc .cat{font-size:5.2cqw;letter-spacing:.32em;color:var(--gold-ink);font-weight:700}
.pc .rule{width:22%;height:1px;background:var(--gold);margin:5cqw 0 6cqw}
.pc img{width:44%;opacity:.95}
.pc .nm{font-size:9.5cqw;font-weight:600;line-height:1.1;margin-top:7cqw;letter-spacing:-.01em}
.pc .id{font-size:4cqw;letter-spacing:.2em;color:var(--muted);margin-top:auto}
.ex-info h1{font-size:clamp(2.2rem,4.6vw,3.4rem);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:10px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.fact{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:0;background:var(--white);border:1px solid var(--border);font-weight:700;font-size:.82rem;letter-spacing:.1em}
.fact svg{color:var(--gold)}
.howto{margin-top:30px;list-style:none;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:1.05rem}
.howto li::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.ex-cta{margin-top:30px;display:flex;gap:10px}
.ex-cta .btn-primary{flex:1;min-height:60px;font-size:1.05rem;letter-spacing:.12em}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.player{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 8px 0 16px;border-radius:0;background:var(--white);border:1px solid var(--border);font-weight:600}
.player button{width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.player button:hover{background:var(--warm)}
.addp{display:flex;gap:8px;margin-top:10px}
.addp input{flex:1;min-height:48px;border:1px solid var(--border);border-radius:0;padding:0 18px;background:var(--white)}

/* ---------- WORKOUT ---------- */
.wo{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding:calc(20px + var(--sat)) 24px calc(24px + var(--sab));animation:fadein .4s var(--ease)}
.wo.fam{background:#F3EEE4}
.wo-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wo-top .eyebrow{font-size:.8rem}
.wo-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.wo h2{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:600;letter-spacing:-.02em}
.ring{position:relative;width:min(72vw,340px);aspect-ratio:1;margin:18px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:#D6CFC1}
.ring .pr{stroke:var(--green);transition:stroke-dashoffset .25s linear}
.ring.rest .pr{stroke:var(--gold)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:clamp(3.2rem,12vw,5rem);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.ring .num span{color:var(--muted);font-size:.9rem;margin-top:6px;letter-spacing:.12em;font-weight:600}
.ring img.mark{position:absolute;width:24%;left:38%;top:38%;opacity:.08}
.wo-bot{display:flex;flex-direction:column;align-items:center;gap:14px}
.wo-bot .btn{min-width:220px;min-height:60px;font-size:1.02rem;letter-spacing:.1em}
.wo .cue{color:var(--muted);max-width:26em;min-height:1.6em}
.done-mark{width:110px;height:110px;position:relative;margin-bottom:10px}
.done-mark img{width:100%;animation:settle 1.2s var(--ease) forwards}
.done-mark svg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px)}
.done-mark circle{stroke:var(--gold);stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.2s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.wo .bigword{font-size:clamp(2.6rem,8vw,4rem);font-weight:600;letter-spacing:-.03em}
.winner{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%;max-width:520px;margin-top:18px}
.winner button{min-height:64px;border-radius:0;background:var(--white);border:1px solid var(--border);font-weight:700;font-size:1.05rem}
.winner button:hover{border-color:var(--gold)}
.score{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.score span{padding:8px 14px;border-radius:0;background:var(--white);border:1px solid var(--border);font-weight:600;font-size:.9rem}
.score b{color:var(--gold-ink)}

/* ---------- PROGRESS ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.stat{padding:28px}
.stat .n{font-size:clamp(2.6rem,6vw,3.8rem);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);margin-top:10px;font-weight:600;font-size:.8rem;letter-spacing:.14em}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr 1fr;gap:10px}.stat{padding:18px}.stat .l{font-size:.68rem;letter-spacing:.08em}}
.bars{padding:28px;margin-top:16px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:14px;align-items:center;padding:9px 0}
.bar .track{height:10px;border-radius:0;background:var(--warm);box-shadow:inset 0 0 0 1px var(--border-soft);overflow:hidden}
.bar .fill{height:100%;border-radius:0;background:var(--green);width:0;transition:width 1s var(--ease)}
.bar .v{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.is-today .d{font-weight:700}
@media(max-width:520px){.bar{grid-template-columns:76px 1fr 54px}}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:16px}
@media(max-width:760px){.badges{grid-template-columns:repeat(3,1fr)}}
.badge{padding:22px 14px;text-align:center}
.badge .ic{width:66px;height:66px;margin:0 auto 12px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff,#f6f0e3)}
.badge .ic img{width:34px;height:34px;display:block}
.badge .t{font-weight:700;font-size:.78rem;letter-spacing:.12em}
.badge .s{color:var(--muted);font-size:.82rem;margin-top:2px}
.badge.locked{opacity:.42}
.badge.locked .ic{border-color:var(--border);background:var(--bg)}
.badge.locked .ic img{filter:grayscale(1);opacity:.5}

/* ---------- WELCOME ---------- */
.welcome{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.welcome .box{max-width:420px;width:100%;text-align:center}
.welcome img{width:64px;margin:0 auto 26px;animation:breathe 6s ease-in-out infinite}
.welcome h1{font-size:2rem;font-weight:600;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin-top:6px}
.welcome input{width:100%;min-height:56px;border:1px solid var(--border);border-radius:0;padding:0 22px;margin-top:28px;font-size:1.05rem;text-align:center;background:#fff}
.welcome input:focus{outline:none;border-color:var(--gold)}
.welcome .btn{margin-top:12px}
.welcome .tag{margin-top:34px;font-size:.78rem;letter-spacing:.24em;color:var(--gold-ink);font-weight:700}

.qz{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + var(--sat)) 24px calc(24px + var(--sab));overflow:auto}
.qz-top{display:flex;align-items:center;gap:14px;max-width:640px;width:100%;margin:0 auto}
.qz-top img{width:26px}
.qz-bar{flex:1;height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--gold);transition:width .5s var(--ease)}
.qz-top .btn{min-height:40px;padding:0 12px}
.qz-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;width:100%;margin:0 auto;padding:30px 0;animation:fadein .4s var(--ease)}
.qz-body .eyebrow{color:var(--gold-ink)}
.qz-body h1{font-size:clamp(1.8rem,4.6vw,2.6rem);font-weight:600;letter-spacing:-.025em;line-height:1.12;margin-top:10px}
.qz-body .lead{color:var(--muted);margin-top:8px;font-size:1.05rem}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.qz-opts.four{grid-template-columns:repeat(4,1fr)}
.qz-opts.one{grid-template-columns:1fr}
@media(max-width:560px){.qz-opts,.qz-opts.four{grid-template-columns:1fr 1fr}}
.qo{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:78px;padding:16px 18px;border:1px solid var(--border);border-radius:0;background:var(--white);text-align:left;transition:border-color .2s,box-shadow .2s,transform .15s}
.qo:hover{border-color:var(--gold)}
.qo:active{transform:scale(.99)}
.qo b{font-size:1.05rem;font-weight:600}
.qo span{color:var(--muted);font-size:.9rem;line-height:1.35}
.qo.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.qz-opts.four .qo{align-items:center;justify-content:center;text-align:center}
.qz-opts.four .qo b{font-size:1.5rem;letter-spacing:-.02em}
.qz-sum{margin-top:26px;border-radius:0;background:var(--green);color:#fff;padding:26px;position:relative;overflow:hidden}
.qz-sum img{position:absolute;right:-30px;bottom:-30px;width:160px;opacity:.12}
.qz-sum dl{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.qz-sum dt{font-size:.75rem;letter-spacing:.14em;color:var(--gold-l);font-weight:700}
.qz-sum dd{font-size:1.15rem;font-weight:600;margin-top:2px}
.qz-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.qz-actions .btn{flex:1;min-width:200px}
.tips{padding:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border)}
.seg button{min-height:38px;font-size:.86rem;font-weight:600;color:var(--muted);border-left:1px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--green);color:#fff}
.tip{margin-top:14px;min-height:96px}
.tip b{display:block;font-weight:600}
.tip p{color:var(--muted);font-size:.93rem;margin-top:4px;line-height:1.5}
.tip-act{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translate(-50%,20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:0;font-weight:600;font-size:.92rem;opacity:0;transition:opacity .3s,transform .3s var(--ease);z-index:200;pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.toast{bottom:calc(100px + var(--sab))}}

/* =========================================================
   MOTION design tokens (brand system v2)
   ========================================================= */
:root{
  --motion-bg:#F7F5F0; --motion-surface:#FFFFFF; --motion-surface-2:#EFEAE2; --motion-surface-dark:#141412;
  --motion-text:#171A18; --motion-muted:#6B6D68; --motion-border:#E2DDD3;
  --motion-gold:#B68E4E; --motion-gold-light:#E0C187; --motion-gold-dark:#977430; --motion-gold-ink:#7A5C25; --motion-gold-tint:#F6EEDC;
  --motion-radius-sm:10px; --motion-radius-md:14px; --motion-radius-lg:18px;
  --motion-shadow:0 1px 2px rgba(23,26,24,.04),0 4px 14px -8px rgba(23,26,24,.12);
  --bg:var(--motion-bg); --white:var(--motion-surface); --warm:var(--motion-surface-2); --text:var(--motion-text); --muted:var(--motion-muted);
  --border:var(--motion-border); --gold:var(--motion-gold); --gold-l:var(--motion-gold-light); --gold-ink:var(--motion-gold-ink);
  --green:#1E3B2F; --green-2:#264A3C; --shadow:var(--motion-shadow);
  --r-lg:var(--motion-radius-lg); --r-md:var(--motion-radius-md); --r-sm:var(--motion-radius-sm);
}
/* radii: calm, consistent */
.card,.next,.sheet,.act,.cam,.ex-visual,.gen,.qz-sum,.dayline,.p-empty,.week,.focus-in .no-think span,.badge,.stat,.tips{border-radius:var(--r-lg)}
.btn,.chip,.opt,.qo,.iconbtn,.seg,.composer form,.field input,.field select,.manual input,.player,.addp input,.sess-banner,.wk-prop input,.winner button,.score span,.fact,.sn-link,.sn-toggle,.daystrip button,.mini-g button,.welcome input,.drop,.hint,.imp-list,.toggle,.qz-bar{border-radius:var(--r-sm)}
.ev,.ghost,.dsg{border-radius:var(--r-sm)}
.seg button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}.seg button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.msg.me{border-radius:16px 16px 4px 16px}
.toast{border-radius:var(--r-md)}
.sym-xs{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px}
.eyebrow .sym-xs{margin-right:8px}

/* nav: brand + gold indicator */
.brand .wmk-svg{height:13px;width:auto;color:var(--text);display:block}
.brand img{width:28px;height:28px}
.sn-link.on{border-left-color:transparent;background:var(--warm);position:relative}
.sn-link.on::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--gold)}
.sn-profile.on b{color:var(--gold-ink)}
.mtop .brand{gap:10px}.mtop .brand .wmk-svg{height:12px}
@media(max-width:760px){
  .botnav{grid-template-columns:repeat(4,1fr)!important;align-items:center}
  .botnav a{position:relative}
  .botnav a img{width:24px;height:24px}
  .botnav a.on{color:var(--text)}
  .botnav a.on::before{content:"";position:absolute;top:-8px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
}

/* rich confirmation toast */
.toast.rich{display:flex;align-items:center;gap:12px;background:var(--motion-surface-dark);padding:14px 20px 14px 14px;font-weight:500;line-height:1.35;text-align:left}
.toast.rich img{width:28px;height:28px}
.toast.rich b{font-weight:600}

/* focused start */
.focus{position:fixed;inset:0;z-index:110;background:var(--motion-surface-dark);color:#FAF8F3;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));animation:fadein .35s var(--ease)}
.focus-x{position:absolute;top:calc(16px + var(--sat));right:16px;color:rgba(250,248,243,.7)}
.focus-in{text-align:center;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:10px}
.focus-sym{width:56px;height:56px;margin-bottom:6px;animation:sway 4s ease-in-out infinite}
.focus .eyebrow{color:var(--gold-l)}
.focus-t{font-size:clamp(4.2rem,16vw,6.4rem);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.focus-d{font-weight:700;letter-spacing:.2em;font-size:1rem;color:var(--gold-l)}
.focus .muted{color:rgba(250,248,243,.66);margin-top:4px}
.focus-a{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:22px}
.focus-a .btn{width:100%;min-height:56px}
.focus .btn-primary{background:var(--gold);color:#171A18}
.focus .btn-line{background:transparent;color:#FAF8F3;border-color:rgba(250,248,243,.25)}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* "no thinking required" chips */
.no-think{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.no-think span{font-size:.76rem;font-weight:700;letter-spacing:.12em;padding:7px 11px;border:1px solid rgba(255,255,255,.28);border-radius:8px}
.next.empty .no-think span,.dsg .no-think span,.act .no-think span,.sheet .no-think span{border-color:var(--border);color:var(--text)}

.ai-nudge{margin-top:20px;padding:18px 22px;display:grid;grid-template-columns:34px 1fr auto;gap:16px;align-items:center}

/* day view */

.msg.bot>img{width:24px;height:24px}

.act{box-shadow:var(--motion-shadow)}

.composer input::placeholder{transition:opacity .3s}
@media(max-width:760px){.thread{padding-bottom:96px}.hello{padding-top:28px}.hello .sugg{gap:8px}.hello .chip{min-height:40px;padding:0 14px;font-size:.84rem}.hello h2{font-size:2.1rem}.hello-q{margin-top:24px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
/* =========================================================
   MOTION UF — app core
   Store → schedule engine → smart planner → views
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='/images/motion-symbol-gold.svg';
const CARDS=window.MUF_CARDS||[];
const cardById=id=>CARDS.find(c=>c.id===String(id).toUpperCase());

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const dow=d=>(d.getDay()+6)%7; // Mon=0
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return addDays(x,-dow(x))};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const DN=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const DS=['MÅN','TIS','ONS','TOR','FRE','LÖR','SÖN'];
const MN=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const niceDate=d=>`${DN[dow(d)]} ${d.getDate()} ${MN[d.getMonth()]}`;
const relDay=s=>{const t=todayStr();if(s===t)return'Idag';if(s===ymd(addDays(new Date(),1)))return'Imorgon';const d=parseYmd(s);return `${DN[dow(d)]} ${d.getDate()}/${d.getMonth()+1}`};
const greeting=()=>{const h=new Date().getHours();return h<5?'God natt':h<10?'God morgon':h<12?'God förmiddag':h<17?'God eftermiddag':h<23?'God kväll':'God natt'};

/* ---------- categories ---------- */
const CAT={
  school:{sv:'Skola',sw:'#CFC7B8'},work:{sv:'Jobb',sw:'#B7C2BB'},training:{sv:'Träning',sw:'#D9C49A'},
  meal:{sv:'Måltid',sw:'#E5E1D9'},personal:{sv:'Personligt',sw:'#CDBFD3'},motion:{sv:'Motion',sw:'#123C32'}
};
const NEED={energy:'Energi',strength:'Styrka',mobility:'Rörlighet',reset:'Reset',surprise:'Överraska mig',family:'Familjeutmaning'};
const NEED_LABEL={energy:'ENERGI',strength:'STYRKA',mobility:'RÖRLIGHET',reset:'RESET',surprise:'MIX',family:'FAMILY CHALLENGE'};
const CAT_SV={strength:'STYRKA',energy:'KONDITION',mobility:'RÖRLIGHET',reset:'RESET',challenge:'UTMANING',together:'TILLSAMMANS'};
const DIFF_SV={easy:'LÄTT',medium:'MEDIUM',hard:'SVÅR'};

/* ---------- store (localStorage, versioned) ---------- */
const KEY='muf.v1';
let S;
const uid=()=>Math.random().toString(36).slice(2,10);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
  if(!S){S={user:null,events:[],sessions:[],completions:[],players:[]};seed();}
}
function seed(){
  const ws=weekStart(new Date());
  const d=i=>ymd(addDays(ws,i));
  S.events=[
    {id:uid(),title:'Skola',category:'school',date:d(0),start:'08:30',end:'15:30',repeat:'weekdays'},
    {id:uid(),title:'Lunch',category:'meal',date:d(0),start:'12:00',end:'12:45',repeat:'weekdays'},
    {id:uid(),title:'Middag',category:'meal',date:d(0),start:'18:30',end:'19:15',repeat:'daily'},
    {id:uid(),title:'Tennis',category:'training',date:d(1),start:'16:00',end:'17:30',repeat:'weekly'},
    {id:uid(),title:'Tennis',category:'training',date:d(3),start:'17:00',end:'18:15',repeat:'weekly'},
    {id:uid(),title:'Brunch',category:'meal',date:d(5),start:'10:00',end:'11:00',repeat:'weekly'},
  ];
  // a little history so Progress isn't empty — only days before today
  const t=dow(new Date());
  const hist=[[0,'16:30',10,'reset',['MOT-IND-006','MOT-IND-002','MOT-IND-010','MOT-IND-013']],[2,'16:15',15,'strength',['MOT-IND-001','MOT-IND-003','MOT-IND-004','MOT-IND-005']]];
  hist.forEach(([i,st,dur,need,cards])=>{
    if(i>=t) return;
    const id=uid();
    S.sessions.push({id,date:d(i),start:st,duration:dur,need,count:cards.length,status:'completed',cards:cards.map((c,k)=>({card_id:c,order:k+1,completed:true}))});
    cards.forEach(c=>S.completions.push({card_id:c,date:d(i),seconds:Math.round(dur*60/cards.length),session_id:id}));
  });
  // today's suggested session goes in once the user has a name (see welcome)
}

/* ---------- schedule engine ---------- */
function occursOn(ev,dateStr){
  if(ev.date===dateStr) return true;
  if(!ev.repeat||ev.repeat==='none') return false;
  if(dateStr<ev.date) return false;
  if(ev.exdates&&ev.exdates.includes(dateStr)) return false;
  const d=parseYmd(dateStr), o=parseYmd(ev.date);
  if(ev.repeat==='daily') return true;
  if(ev.repeat==='weekdays') return dow(d)<5;
  if(ev.repeat==='weekly') return dow(d)===dow(o);
  return false;
}
function eventsOn(dateStr){
  const evs=S.events.filter(e=>occursOn(e,dateStr)).map(e=>({...e,date:dateStr,kind:'event'}));
  const ses=S.sessions.filter(s=>s.date===dateStr&&s.status!=='skipped').map(s=>({
    id:s.id,kind:'session',category:'motion',title:`${s.duration} min ${NEED[s.need]||'Motion'}`,date:s.date,start:s.start,end:toHM(toMin(s.start)+s.duration),session:s
  }));
  return [...evs,...ses].sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function busy(dateStr){return eventsOn(dateStr).map(e=>[toMin(e.start),toMin(e.end||toHM(toMin(e.start)+30))])}

/* Free windows: realistic, not every gap.
   Day bounded 07:00–21:00, 20 min buffer after school/work/training, 30 min before meals. */
function freeWindows(dateStr){
  const evs=eventsOn(dateStr);
  const blocks=evs.map(e=>{
    let a=toMin(e.start), b=toMin(e.end||toHM(a+30));
    if(['school','work','training'].includes(e.category)) b+=20;
    if(e.category==='meal') a-=30;
    return [a,b];
  }).sort((x,y)=>x[0]-y[0]);
  const isWeekend=dow(parseYmd(dateStr))>=5;
  let cur=isWeekend?9*60:7*60; const end=21*60; const out=[];
  for(const [a,b] of blocks){ if(a>cur) out.push([cur,a]); cur=Math.max(cur,b); }
  if(end>cur) out.push([cur,end]);
  let res=out.filter(([a,b])=>b-a>=30);
  if(dateStr===todayStr()){const n=nowMin()+10;res=res.map(([a,b])=>[Math.max(a,n),b]).filter(([a,b])=>b-a>=25)}
  return res.map(([a,b])=>({date:dateStr,start:a,end:b}));
}
/* One sensible suggestion per day, only if the day has no Motion session yet. */
const P=()=>(S.user&&S.user.prefs)||{};
const TIMEPREF={morning:[390,570],lunch:[690,810],afternoon:[900,1080],evening:[1080,1260]};
const GOALNEED={energy:'energy',strength:'strength',mobility:'mobility',stress:'reset',habit:'surprise'};
const goalNeed=()=>GOALNEED[P().goal]||'reset';
function suggestFor(dateStr){
  if(eventsOn(dateStr).some(e=>e.category==='motion')) return null;
  const w=freeWindows(dateStr); if(!w.length) return null;
  const pr=TIMEPREF[P().time];
  const overlap=(x,r)=>Math.max(0,Math.min(x.end,r[1])-Math.max(x.start,r[0]));
  const score=x=>{const mid=(x.start+x.end)/2;let s=Math.min(x.end-x.start,120);
    if(pr){ if(overlap(x,pr)>=20) s+=120; } else if(mid>=15*60&&mid<=19.5*60) s+=80;
    if(mid<9*60&&P().time!=='morning') s-=40; return s};
  const best=[...w].sort((a,b)=>score(b)-score(a))[0];
  const len=best.end-best.start;
  const want=P().len||null;
  const dur=want&&len>=want+10?want:len>=90?15:len>=45?10:5;
  let st=best.start+(len>=60?Math.min(45,Math.round(len/3)):0);
  if(pr&&overlap(best,pr)>=dur){ st=Math.max(st,pr[0]); if(st+dur>best.end) st=best.end-dur; }
  st=Math.ceil(st/15)*15; if(st+dur>best.end) st=Math.floor((best.end-dur)/5)*5;
  const sg={date:dateStr,window:[best.start,best.end],start:st,duration:dur,need:goalNeed()};
  // Family Motion: weekend afternoons, when the user plays with others
  const d=parseYmd(dateStr);
  if(['family','both'].includes(P().deck)&&dow(d)===6&&overlap(best,[13*60,17*60])>=30){ sg.family=true; sg.need='family'; sg.duration=15; sg.start=Math.max(best.start,14*60); if(sg.start+15>best.end) sg.start=best.end-15; }
  return sg;
}
function reasonFor(sg){
  const evs=eventsOn(sg.date).filter(e=>e.kind==='event');
  const before=[...evs].reverse().find(e=>toMin(e.end||e.start)<=sg.start);
  const after=evs.find(e=>toMin(e.start)>=sg.start+sg.duration);
  const free=(after?toMin(after.start):sg.window[1])-sg.start;
  const nm=e=>e.title.toLowerCase();
  if(sg.family) return 'Alla är hemma. Femton minuter tillsammans.';
  if(before&&after) return `Du har ${free} minuter mellan ${nm(before)} och ${nm(after)}.`;
  if(after) return `Du har ${free} minuter innan ${nm(after)}.`;
  if(before) return `Lugnt efter ${nm(before)}. Det räcker gott.`;
  return 'Inget annat inplanerat där. Det räcker gott.';
}
function weekSessionCount(ref=new Date()){
  const ws=weekStart(ref); const a=ymd(ws), b=ymd(addDays(ws,6));
  return S.sessions.filter(s=>s.date>=a&&s.date<=b&&s.status!=='skipped').length;
}
/* Week plan: ~3 sessions spread out (≥1 rest day between), skipping days that already have one. */
function planWeek(ref=new Date(),opt={}){
  const ws=weekStart(ref); const t=todayStr(); const picks=[];
  const order=[0,2,5,3,1,4,6];
  const g=goalNeed(); const sec={energy:'strength',strength:'energy',mobility:'reset',reset:'mobility',surprise:'surprise'}[g];
  const needs=[g,sec,g,'reset',g];
  const goal=opt.count||P().perWeek||3; const target=Math.min(5,Math.max(0,goal-weekSessionCount(ref))); const gap=goal>=4?1:2;
  const skip=opt.exclude||new Set();
  let lastIdx=-9;
  const taken=new Set(S.sessions.filter(s=>s.status!=='skipped').map(s=>s.date));
  for(const i of order){
    if(picks.length>=target) break;
    const ds=ymd(addDays(ws,i)); if(ds<t||taken.has(ds)||skip.has(i)) continue;
    if(picks.some(p=>Math.abs(p.i-i)<gap)) continue;
    const sg=suggestFor(ds); if(!sg) continue;
    const need=needs[picks.length]; const dur=i>=5?Math.min(20,sg.duration+5):sg.duration;
    picks.push({i,date:ds,start:toHM(sg.start),duration:sg.family?15:dur,need:sg.family?'family':need});
  }
  return picks.sort((a,b)=>a.i-b.i);
}
const cardsFor=min=>min<=5?2:min<=10?4:min<=15?5:6;
function createSession({date,start,duration,need}){
  const s={id:uid(),date,start,duration:+duration,need:need||'surprise',count:cardsFor(+duration),status:'planned',cards:[]};
  S.sessions.push(s); save(); return s;
}
function nextMotion(){
  const t=todayStr(), n=nowMin();
  const up=S.sessions.filter(s=>s.status==='planned'&&(s.date>t||(s.date===t&&toMin(s.start)+s.duration>=n-5)))
    .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return up[0]||null;
}
function contextLine(s){
  const evs=eventsOn(s.date).filter(e=>e.kind==='event'); const st=toMin(s.start);
  const before=[...evs].reverse().find(e=>toMin(e.end||e.start)<=st);
  const after=evs.find(e=>toMin(e.start)>=st+s.duration);
  const nm=e=>e.title.toLowerCase();
  if(before&&after) return `Passar fint mellan ${nm(before)} och ${nm(after)}.`;
  if(after) return `Hinns med innan ${nm(after)}.`;
  if(before) return `En lugn stund efter ${nm(before)}.`;
  return 'Ett kort pass, sedan är du klar.';
}

/* ---------- stats ---------- */
function weekStats(ref=new Date()){
  const ws=weekStart(ref);const days=[...Array(7)].map((_,i)=>ymd(addDays(ws,i)));
  const comp=S.completions.filter(c=>days.includes(c.date));
  const per=days.map(d=>Math.round(comp.filter(c=>c.date===d).reduce((a,c)=>a+c.seconds,0)/60));
  const sessions=S.sessions.filter(s=>days.includes(s.date)&&s.status==='completed').length;
  return {days,per,minutes:per.reduce((a,b)=>a+b,0),sessions,cards:comp.length};
}
function totals(){
  const minutes=Math.round(S.completions.reduce((a,c)=>a+c.seconds,0)/60);
  const sessions=S.sessions.filter(s=>s.status==='completed').length;
  const cards=S.completions.length;
  const ds=new Set(S.completions.map(c=>c.date)); let best=0,run=0;
  const all=[...ds].sort(); let prev=null;
  for(const d of all){ if(prev&&ymd(addDays(parseYmd(prev),1))===d) run++; else run=1; best=Math.max(best,run); prev=d; }
  return {minutes,sessions,cards,streak:best};
}

    return `<div class="dayhead"><button class="iconbtn" data-d="-1" aria-label="Föregående dag">${IC.l}</button><div><b>${DS[dow(sel)]} ${sel.getDate()} ${MN[sel.getMonth()].slice(0,3).toUpperCase()}</b><span>${relDay(pSel)}</span></div><button class="iconbtn" data-d="1" aria-label="Nästa dag">${IC.r}</button></div>
      <div class="card dayline" id="dayline">${items.length?`<ul>${items.map(x=>`<li><span class="dt">${toHM(x.m)}</span><div>${x.h}</div></li>`).join('')}</ul>`:`<p class="muted" style="padding:28px">Inget planerat. En lugn dag.</p>`}</div>`;
  };
  // ---- week grid ----
  const weekView=()=>{
    const hours=[...Array(H1-H0)].map((_,i)=>`<div>${pad(H0+i)}:00</div>`).join('');
    const cols=days.map(d=>{
      const ds=ymd(d); const evs=eventsOn(ds).filter(e=>pFilter.has(e.category));
      const items=evs.map(e=>({e,a:toMin(e.start),b:toMin(e.end||toHM(toMin(e.start)+30))}));
      items.forEach(it=>{it.inner=items.some(o=>o!==it&&o.a<=it.a&&o.b>=it.b&&(o.b-o.a)>(it.b-it.a))});
      const flow=items.filter(i=>!i.inner);
      flow.forEach(it=>{it.lane=0;const used=flow.filter(o=>o!==it&&o.done&&o.a<it.b&&it.a<o.b).map(o=>o.lane);while(used.includes(it.lane))it.lane++;it.done=true});
      flow.forEach(it=>{it.n=1+Math.max(0,...flow.filter(o=>o.a<it.b&&it.a<o.b).map(o=>o.lane))});
      const blocks=items.map(({e,a,b,inner,lane,n})=>{
        a=Math.max(a,H0*60); b=Math.min(b,H1*60); if(b<=a) return '';
        const top=(a-H0*60)/60*HH, h=Math.max((b-a)/60*HH,e.category==='motion'?60:28);
        const pos=inner?'left:34%;right:4px;z-index:2;':n>1?`left:calc(${lane/n*100}% + 3px);right:auto;width:calc(${100/n}% - 6px);`:'';
        return blockHTML(e,`${pos}top:${top}px;height:${h}px`);
      }).join('');
      const sg=pFilter.has('motion')&&ds>=t?suggestFor(ds):null;
      const ghost=sg?sgHTML(sg,`top:${(sg.start-H0*60)/60*HH}px;height:${Math.max(sg.duration/60*HH,48)}px`):'';
      const now=ds===t&&nowMin()>H0*60&&nowMin()<H1*60?`<div class="nowline" style="top:${(nowMin()-H0*60)/60*HH}px"></div>`:'';
      return `<div class="daycol ${ds===t?'is-today':''}" data-day="${ds}" style="height:${(H1-H0)*HH}px">${blocks}${ghost}${now}</div>`;
    }).join('');
    return `<div class="card week" style="--hh:${HH}px">
      <div class="wk-head"><div></div>${days.map((d,i)=>`<button class="${ymd(d)===t?'is-today':''}" data-open="${ymd(d)}" aria-label="Visa ${DN[i]}"><div class="dn">${DS[i]}</div><div class="dd">${d.getDate()}</div></button>`).join('')}</div>
      <div class="wk-body" id="wkb"><div class="hours">${hours}</div>${cols}</div></div>`;
  };
  const empty=weekEvents===0?`<section class="card p-empty"><img src="${LOGO}" alt=""><div><h3>Din vecka börjar här.</h3><p>Lägg in det som redan tar plats i livet. Motion hittar resten.</p></div><div class="p-empty-a"><button class="btn btn-primary btn-sm" data-add>${IC.plus} Lägg till aktivitet</button><button class="btn btn-line btn-sm" data-ai>Planera med AI</button><button class="btn btn-ghost btn-sm" data-imp>${IC.up} Importera schema</button></div></section>`:'';
  el.innerHTML=`
    <header class="p-head">
      <div class="p-title"><img src="${LOGO}" alt="" class="p-sym"><div><span class="eyebrow">Planerare · Din vecka</span><h1>${range}</h1></div></div>
      <div class="p-ctl">
        <div class="seg sm" role="tablist" aria-label="Vy"><button role="tab" aria-selected="${pView==='day'}" class="${pView==='day'?'on':''}" data-v="day">Dag</button><button role="tab" aria-selected="${pView==='week'}" class="${pView==='week'?'on':''}" data-v="week">Vecka</button></div>
        <button class="iconbtn" data-w="-1" aria-label="Föregående vecka">${IC.l}</button><button class="btn btn-line btn-sm" data-w="0">Idag</button><button class="iconbtn" data-w="1" aria-label="Nästa vecka">${IC.r}</button>
      </div>
      <div class="p-act"><button class="btn btn-ai btn-sm" data-ai><img src="${LOGO}" alt="" class="sym-xs">Planera med AI</button><button class="btn btn-line btn-sm" data-imp>${IC.up} Importera</button><button class="btn btn-primary btn-sm" data-add>${IC.plus} Lägg till</button></div>
    </header>
    <div class="planner v-${pView}">
      <aside class="p-side">
        <div class="card mini" id="mini"></div>
        <div class="card windows"><div class="eyebrow gold" style="margin-bottom:4px">${SYMI}Motion hittade</div>
          ${wins.length?wins.map(w=>`<div class="win"><div class="d">${relDay(w.ds)} · ${toHM(w.sg.window[0])}–${toHM(w.sg.window[1])}</div><div class="r">${w.sg.family?'Family challenge':w.sg.duration+' min'} kl ${toHM(w.sg.start)}</div><p>${reasonFor(w.sg)}</p><button class="btn btn-line btn-sm" data-ga="${w.ds}|${toHM(w.sg.start)}|${w.sg.duration}|${w.sg.need}">Lägg till</button></div>`).join(''):'<p class="muted" style="font-size:.92rem">Inga fler luckor som passar den här veckan. Det är också okej.</p>'}
        </div>
        ${tipCardHTML(pSel)}
        <div class="card filters"><div class="eyebrow" style="margin-bottom:6px">Visa</div>
          ${Object.entries(CAT).map(([k,v])=>`<label><input type="checkbox" data-f="${k}" ${pFilter.has(k)?'checked':''}>${v.sv}<span class="sw" style="background:${v.sw}"></span></label>`).join('')}
        </div>
      </aside>
      <section class="p-main">
        ${empty}
        <div class="daystrip">${days.map((d,i)=>{const ds=ymd(d);return `<button class="${ds===pSel?'on':''}" data-sel="${ds}"><span class="dn">${DS[i]}</span><span class="dd">${d.getDate()}</span>${eventsOn(ds).some(e=>e.category==='motion')?'<i class="has"></i>':'<i></i>'}</button>`}).join('')}</div>
        ${pView==='day'?dayView():weekView()}
      </section>
    </div>`;
  miniCal($('#mini',el)); bindTips(el,pSel);
  if(window.matchMedia('(max-width:1060px)').matches){ const host=$('.p-main',el); const d=document.createElement('div'); d.style.marginTop='16px'; d.innerHTML=tipCardHTML(pSel); host.appendChild(d.firstElementChild); $('.p-side #tips',el)?.remove(); }
  const wkb=$('#wkb',el); if(wkb) wkb.scrollTop=Math.max(0,((ymd(new Date())===pSel?nowMin():15*60)-H0*60-90)/60*HH);
  const dl=$('#dayline',el); if(dl){ let x0=null; dl.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true}); dl.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)shiftDay(dx<0?1:-1)}); }
  el.addEventListener('click',e=>{
    const v=e.target.closest('[data-v]'); if(v){ pView=v.dataset.v; return render(); }
    const w=e.target.closest('[data-w]'); if(w){ const k=+w.dataset.w; pRef=k===0?new Date():addDays(pRef,7*k); pSel=k===0?todayStr():ymd(weekStart(pRef)); return render(); }
    const dd=e.target.closest('[data-d]'); if(dd) return shiftDay(+dd.dataset.d);
    const sl=e.target.closest('[data-sel]'); if(sl){ pSel=sl.dataset.sel; return render(); }
    const op=e.target.closest('[data-open]'); if(op){ pSel=op.dataset.open; pView='day'; return render(); }
    if(e.target.closest('[data-add]')) return addFlow({date:pSel});
    if(e.target.closest('[data-imp]')) return importFlow();
    if(e.target.closest('[data-ai]')){ window._pendingAI=weekEvents?'Gör veckan lite bättre':'Planera min vecka'; return go('ai'); }
    const ga=e.target.closest('[data-ga]'); if(ga){ const [d,st,du,nd]=ga.dataset.ga.split('|'); const s2=createSession({date:d,start:st,duration:+du,need:nd}); done(s2); return render(); }
    const g=e.target.closest('[data-g]'); if(g){ const [d,st,du]=g.dataset.g.split('|'); return suggestionSheet(d,st,+du); }
    const ss=e.target.closest('[data-s]'); if(ss) return sessionSheet(S.sessions.find(x=>x.id===ss.dataset.s));
    const ev=e.target.closest('[data-e]'); if(ev) return eventSheet(S.events.find(x=>x.id===ev.dataset.e), ev.closest('[data-day]')?.dataset.day||pSel);
  });
  el.addEventListener('change',e=>{const f=e.target.dataset.f; if(!f)return; e.target.checked?pFilter.add(f):pFilter.delete(f); render();});
}
function shiftDay(k){ const d=addDays(parseYmd(pSel),k); pSel=ymd(d); pRef=d; render(); }
function suggestionSheet(date,start,duration){
  const sg=suggestFor(date)||{date,start:toMin(start),duration,window:[toMin(start),toMin(start)+duration],need:goalNeed()};
  openSheet(`<span class="eyebrow gold">${SYMI}${sg.family?'Family Motion':'Motion hittade en lucka'}</span>
    <h3 style="margin-top:8px">${relDay(date)} ${start}–${toHM(toMin(start)+duration)}</h3>
    <p class="muted">${reasonFor(sg)}</p>
    <div class="no-think" style="margin-top:16px"><span>${duration} MIN</span><span>${sg.family?'FAMILJEKORT':'DRA '+cardsFor(duration)+' KORT'}</span><span>INGEN UTRUSTNING</span></div>
    <div class="sheet-actions"><button class="btn btn-line" id="chg">Ändra</button><button class="btn btn-primary" id="ok">Lägg till</button></div>`,sh=>{
    $('#ok',sh).onclick=()=>{ const s2=createSession({date,start,duration,need:sg.need}); closeSheet(); done(s2); render(); };
    $('#chg',sh).onclick=()=>motionFlow({date,start,duration,step:1});
  });
}
function miniCal(box){
  const m=pMonth; const first=new Date(m.getFullYear(),m.getMonth(),1); const start=addDays(first,-dow(first));
  const ws=ymd(weekStart(pRef)), we=ymd(addDays(weekStart(pRef),6)), t=todayStr();
  let cells=''; for(let i=0;i<42;i++){const d=addDays(start,i),ds=ymd(d);cells+=`<button data-md="${ds}" class="${d.getMonth()!==m.getMonth()?'out':''} ${ds>=ws&&ds<=we?'inweek':''} ${ds===t?'is-today':''}">${d.getDate()}</button>`}
  box.innerHTML=`<div class="mini-h"><button data-mm="-1" aria-label="Föregående månad">${IC.l}</button><span style="text-transform:capitalize">${MN[m.getMonth()]} ${m.getFullYear()}</span><button data-mm="1" aria-label="Nästa månad">${IC.r}</button></div><div class="mini-g">${['M','T','O','T','F','L','S'].map(x=>`<span class="wd">${x}</span>`).join('')}${cells}</div>`;
  box.onclick=e=>{const mm=e.target.closest('[data-mm]');if(mm){pMonth=new Date(m.getFullYear(),m.getMonth()+ +mm.dataset.mm,1);return miniCal(box)}
    const md=e.target.closest('[data-md]');if(md){pRef=parseYmd(md.dataset.md);pSel=md.dataset.md;render()}};
}

      if(!o.title||!o.date||!o.start||!o.end) return toast('Fyll i titel, datum och tid');

    };
  });

/* ---------- Motion session creation: time → need → generated ---------- */
function motionFlow(pre={}){
  const st={date:pre.date||todayStr(),start:pre.start||null,duration:pre.duration||null,need:pre.need||null};
  let step=pre.step||0;
  if(st.duration&&!pre.step) step=1;
  const draw=sh=>{
    const dots=`<div class="steps-dots">${[0,1,2].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
    let h='';
    if(step===0) h=`${dots}<h3>Hur mycket tid har du?</h3><div class="opts four">${[5,10,15,20].map(m=>`<button class="opt" data-m="${m}">${m} min</button>`).join('')}</div>`;
    else if(step===1) h=`${dots}<h3>Vad behöver du?</h3><div class="opts five">${Object.entries(NEED).map(([k,v])=>`<button class="opt" data-n="${k}">${v}</button>`).join('')}</div>`;
    else {
      st.need=st.need||goalNeed();
      if(!st.start){ const sg=suggestFor(st.date); st.start=sg?toHM(sg.start):toHM(Math.ceil((Math.max(nowMin()+15,16*60))/15)*15) }
      const cards=cardsFor(st.duration); const lv=P().level; const diff=lv==='beginner'?'LÄTT':lv==='regular'?(st.duration>=15?'SVÅR':'MEDIUM'):(st.duration>=15?'MEDIUM':'LÄTT');
      h=`${dots}<h3>Ditt pass</h3>
      <div class="gen"><img src="${LOGO}" alt=""><span class="eyebrow">${NEED_LABEL[st.need]}</span><div class="big">${st.duration} min</div>
        <div class="row"><span class="tag">${cards} KORT</span><span class="tag">${st.need==='mobility'||st.need==='reset'?'RÖRLIGHET':'HELKROPP'}</span><span class="tag">${diff}</span></div></div>
      <div class="form"><div class="field"><label for="m-d">Dag</label><input id="m-d" type="date" value="${st.date}"></div><div class="field"><label for="m-s">Tid</label><input id="m-s" type="time" value="${st.start}" step="300"></div></div>
      <p class="muted" style="font-size:.92rem;margin-top:12px">Du drar korten ur leken när det är dags. Vilka övningar det blir avgörs av dem.</p>
      <div class="sheet-actions"><button class="btn btn-line" id="back">Tillbaka</button><button class="btn btn-primary" id="addp">Lägg till i planeraren</button></div>`;
    }
    sh.innerHTML=`<button class="x" aria-label="Stäng" data-close>${IC.x}</button>`+h;
  };
  openSheet('',sh=>{
    draw(sh);
    sh.addEventListener('click',e=>{
      const m=e.target.closest('[data-m]'); if(m){st.duration=+m.dataset.m;step=1;return draw(sh)}
      const n=e.target.closest('[data-n]'); if(n){st.need=n.dataset.n;step=2;return draw(sh)}
      if(e.target.closest('#back')){step=st.duration&&step===2?1:0;return draw(sh)}
      if(e.target.closest('#addp')){st.date=$('#m-d',sh).value;st.start=$('#m-s',sh).value;const s2=createSession(st);closeSheet();done(s2);render()}
    });
  });
}
function sessionSheet(s){
  if(!s) return;
  const done=s.status==='completed';
  openSheet(`<span class="eyebrow gold">Motion · ${relDay(s.date)}</span><h3 style="margin-top:6px">${s.start} · ${s.duration} min ${NEED[s.need]||''}</h3>
    <p class="muted">${s.count} kort. ${done?'Klart.':contextLine(s)}</p>
    ${done?`<ul class="howto">${s.cards.map(c=>`<li>${esc((cardById(c.card_id)||{}).name||c.card_id)}</li>`).join('')}</ul>`:`
    <div class="form"><div class="field"><label for="s-d">Dag</label><input id="s-d" type="date" value="${s.date}"></div><div class="field"><label for="s-s">Tid</label><input id="s-s" type="time" value="${s.start}" step="300"></div>
    <div class="field full"><label for="s-m">Längd</label><select id="s-m">${[5,10,15,20].map(m=>`<option ${m===s.duration?'selected':''} value="${m}">${m} min</option>`).join('')}</select></div></div>
    <div class="sheet-actions"><button class="btn btn-line" id="rm">Ta bort</button><button class="btn btn-line" id="sv">Spara</button></div>
    <button class="btn btn-primary btn-block" style="margin-top:10px" id="go">Starta nu</button>`}`,sh=>{
    if(done) return;
    $('#sv',sh).onclick=()=>{s.date=$('#s-d',sh).value;s.start=$('#s-s',sh).value;s.duration=+$('#s-m',sh).value;s.count=cardsFor(s.duration);save();closeSheet();toast('Uppdaterat');render()};
    $('#rm',sh).onclick=()=>{S.sessions=S.sessions.filter(x=>x.id!==s.id);save();closeSheet();toast('Borttaget');render()};
    $('#go',sh).onclick=()=>{closeSheet(true);startSession(s.id)};
  });
}

function runReadTool(name,inp){
  if(name==='get_schedule'){ const out={}; let d=parseYmd(inp.from); const end=parseYmd(inp.to); let n=0; while(d<=end&&n<14){const ds=ymd(d);out[ds]=eventsOn(ds).map(e=>({id:e.session?e.session.id:e.id,title:e.category==='motion'?'Motion':e.title,category:e.category,start:e.start,end:e.end}));d=addDays(d,1);n++} return out; }
  if(name==='find_free_windows') return freeWindows(inp.date).map(w=>`${toHM(w.start)}-${toHM(w.end)}`);
  if(name==='get_recent_sessions') return {sessions:S.sessions.slice(-6),cards:S.completions.slice(-10).map(c=>({...c,name:(cardById(c.card_id)||{}).name}))};
  return {error:'unknown tool'};
}
function proposalFromTool(name,inp){
  if(name==='propose_motion_session') return {type:'add',date:inp.date,start:inp.start,duration:inp.duration,need:inp.need||'reset'};
  if(name==='propose_move_session'){ const s=S.sessions.find(x=>x.id===inp.session_id); if(!s) return null; return {type:'move',id:s.id,from:s.start,fromDate:s.date,date:inp.new_date||s.date,start:inp.new_start}; }
  if(name==='propose_delete_session'){ const s=S.sessions.find(x=>x.id===inp.session_id); return s?{type:'delete',id:s.id,date:s.date,start:s.start}:null; }
  if(name==='propose_event') return {type:'event',...inp,repeat:inp.repeat||'none'};
  if(name==='propose_change_event'){ const ev=S.events.find(x=>x.id===inp.event_id); if(!ev) return null; return {type:'editEvent',id:ev.id,title:ev.title,date:inp.date||ev.date,from:[ev.start,ev.end],to:[inp.new_start,inp.new_end],repeating:ev.repeat&&ev.repeat!=='none'}; }
  if(name==='propose_week_plan') return {type:'week',sessions:inp.sessions.map(s=>({...s,need:s.need||'reset',on:true}))};
  return null;
}

async function askAPI(text){
  apiMsgs.push({role:'user',content:text});
  const actions=[]; let finalText='';
  for(let i=0;i<5;i++){
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_tokens:700,system:SYSTEM(),messages:apiMsgs,tools:TOOLS})});
    if(!r.ok) throw new Error('api '+r.status);
    const data=await r.json(); const content=data.content||[];
    apiMsgs.push({role:'assistant',content});
    const uses=content.filter(c=>c.type==='tool_use');
    finalText+=content.filter(c=>c.type==='text').map(c=>c.text).join('\n');
    if(!uses.length||data.stop_reason!=='tool_use') break;
    const results=uses.map(u=>{
      if(u.name.startsWith('propose_')){ const p=proposalFromTool(u.name,u.input||{}); if(p) actions.push(p); return {type:'tool_result',tool_use_id:u.id,content:p?'Förslaget visas för användaren och väntar på bekräftelse.':'Kunde inte skapa förslaget (okänt id).'}; }
      return {type:'tool_result',tool_use_id:u.id,content:JSON.stringify(runReadTool(u.name,u.input||{}))};
    });
    apiMsgs.push({role:'user',content:results});
  }
  return {text:finalText.trim(),actions};
}

  if(/flytta|move/.test(q)&&times.length){
    const named=/imorgon|morgondag|tomorrow|idag|today|dagens/.test(q);
    const s=S.sessions.filter(x=>x.status==='planned'&&x.date===day)[0]||(!named&&S.sessions.filter(x=>x.status==='planned'&&x.date>=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))[0]);
    if(!s) return {text:`Du har inget pass ${day===t?'idag':'imorgon'} att flytta.\nVill du att jag lägger ett kl ${times[times.length-1]} i stället?`,actions:[{type:'add',date:day,start:times[times.length-1],duration:S.user.prefLen||10,need:'reset'}]};
    return {text:'Så här blir det.',actions:[{type:'move',id:s.id,from:s.start,fromDate:s.date,date:s.date,start:times[times.length-1]}]};
  }
  // no motivation
  if(/orkar inte|inte lust|ingen lust|don.?t feel|pallar inte|trött/.test(q)) return {text:'Då gör vi det mindre.\nFem minuter. Två kort. Sedan är du klar.',actions:[{type:'add',date:t,start:toHM(Math.ceil((nowMin()+5)/5)*5),duration:5,need:'reset',startNow:true}]};
  // I have N minutes
  const mm=q.match(/(\d{1,2})\s*(min|minuter|minutes)/);
  if(mm&&/har|have|got/.test(q)&&!/vecka/.test(q)){ const d=[5,10,15,20].reduce((a,b)=>Math.abs(b-+mm[1])<Math.abs(a-+mm[1])?b:a); return {text:`${d} minuter räcker. Dra ${cardsFor(d)} kort och kör.`,actions:[{type:'add',date:t,start:toHM(Math.ceil((nowMin()+5)/5)*5),duration:d,need:'surprise',startNow:true}]}; }
  // plan week
  if(/vecka|week/.test(q)){ const p=planWeek(); if(!p.length) return {text:`Du har redan ${weekSessionCount()} pass den här veckan, och ditt mål är ${P().perWeek||3}. Jag skulle låta den vara.`,actions:[]};
    return {text:`${p.length===1?'Ett pass till':p.length+' korta pass'} så når du ditt mål på ${P().perWeek||3} i veckan. Inga maraton, bara luckor som faktiskt passar.`,actions:[{type:'week',sessions:p.map(x=>({...x,on:true}))}]}; }
  // user tells their day: "skola till 15:30 och middag 18:00"
  if(times.length>=2&&!/flytta/.test(q)){ const a=toMin(times[0]),b=toMin(times[times.length-1]); if(b-a>=40){ const st=Math.ceil((a+45)/15)*15; return {text:`Du har en bra lucka mellan dem.\nJag skulle lägga ett pass på 10 minuter kl ${toHM(st)}.`,actions:[{type:'add',date:day,start:toHM(st),duration:10,need:'reset'}]}; } }
  // change today's session
  if(/ändra|change/.test(q)&&/(dagens|today)/.test(q)){ const s=S.sessions.find(x=>x.date===t&&x.status==='planned'); if(!s) return {text:'Du har inget pass idag än. Vill du att jag hittar en lucka?',actions:[],chips:['Planera min dag']};
    return {text:`Dagens pass är ${s.duration} minuter kl ${s.start}. Vad vill du ändra?`,actions:[],chips:['Gör det kortare','Flytta det en timme',`Ta bort dagens pass`]}; }
  if(/kortare|shorter/.test(q)){ const s=S.sessions.find(x=>x.date===t&&x.status==='planned'); if(s){const nd=Math.max(5,s.duration-5);return {text:`Då kör vi ${nd} minuter i stället.`,actions:[{type:'resize',id:s.id,duration:nd,start:s.start}]}} }
  if(/en timme|one hour/.test(q)){ const s=S.sessions.find(x=>x.date===t&&x.status==='planned'); if(s) return {text:'En timme senare, så här.',actions:[{type:'move',id:s.id,from:s.start,fromDate:s.date,date:s.date,start:toHM(toMin(s.start)+60)}]} }
  if(/ta bort|delete|remove/.test(q)){ const s=S.sessions.find(x=>x.date===day&&x.status==='planned'); if(s) return {text:'Okej. Bekräfta så tar jag bort det.',actions:[{type:'delete',id:s.id,date:s.date,start:s.start}]} }
  // tips: stretch, health, diet
  const tp=localTip(q.replace(/^fler (\w+)tips/,'ge mig några $1tips')); if(tp) return tp;
  // when should I train / plan my day
  if(/när|when|planera min dag|plan my day|dag/.test(q)){
    const sg=suggestFor(day); const has=S.sessions.find(x=>x.date===day&&x.status==='planned');
    if(has) return {text:`Du har redan ett pass ${day===t?'idag':'imorgon'} kl ${has.start}. Det räcker.`,actions:[]};
    const sgx=suggestFor(day); if(sgx) return {text:`${eventsOn(day).length>=3?(day===t?'Dagen':'Imorgon')+' ser ganska full ut, men det finns plats.\n':''}${reasonFor(sgx)}`,actions:[{type:'add',date:day,start:toHM(sgx.start),duration:sgx.duration,need:sgx.need}]};
    if(!sg) return {text:`${day===t?'Idag':'Imorgon'} ser fullt ut. Jag skulle hoppa över, eller ta fem minuter efter middagen.`,actions:[]};
    const full=eventsOn(day).length>=3;
    return {text:`${full?(day===t?'Dagen':'Imorgon')+' ser ganska full ut.\n':''}Du har en tydlig lucka ${toHM(sg.window[0])}–${toHM(sg.window[1])}.\nJag skulle använda ${sg.duration} minuter där.`,actions:[{type:'add',date:day,start:toHM(sg.start),duration:sg.duration,need:'reset'}]};
  }
  return {text:'Jag kan planera din vecka, hitta nästa lucka, flytta ett pass eller bygga något kort just nu.',actions:[],chips:['Planera min vecka','Hitta nästa träningslucka','Ge mig något snabbt']};
}

function applyAction(a){
  if(a.type==='add'){ const s=createSession(a); return s; }
  if(a.type==='move'){ const s=S.sessions.find(x=>x.id===a.id); if(s){s.date=a.date;s.start=a.start;save()} }
  if(a.type==='resize'){ const s=S.sessions.find(x=>x.id===a.id); if(s){s.duration=a.duration;s.count=cardsFor(a.duration);save()} }
  if(a.type==='delete'){ S.sessions=S.sessions.filter(x=>x.id!==a.id); save(); }
  if(a.type==='event'){ S.events.push({id:uid(),title:a.title,category:a.category,date:a.date,start:a.start,end:a.end,repeat:a.repeat}); save(); }
  if(a.type==='week'){ a.sessions.filter(s=>s.on).forEach(s=>createSession(s)); }
  if(a.type==='editEvent') changeEvent(a.id,a.date,a.to[0],a.to[1],a.scope||'one');
  if(a.type==='import') applyImport(a.items);
}
